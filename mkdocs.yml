site_name: 清屿服务器规则
site_description: 清屿服务器官方规则文档
site_url: https://mcqingyu-team.github.io/QingYu-docs/
repo_url: https://github.com/MCQingYu-Team/QingYu-docs
repo_name: QingYu-docs
docs_dir: 规则
edit_uri: edit/main/规则/

theme:
  name: material
  language: zh
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js

nav:
  - 首页: index.md
  - 玩家守则: 清屿服务器玩家守则.md
  - 管理员条例: 清屿服务器管理员条例.md
  - 地铁乘车管理条例: 清屿服务器地铁乘车管理条例.md
  - 玩家身份与治理条例: 清屿服务器玩家身份与治理条例.md
  - 七日阳光流程: 清屿服务器七日阳光流程.md
  - 处罚细目表:
      - 处罚细目表: 处罚细目表.md
      - 语言类（L）: 处罚细目/01-语言类.md
      - 破坏类（P）: 处罚细目/02-破坏类.md
      - 作弊类（C）: 处罚细目/03-作弊类.md
      - 经济类（E）: 处罚细目/04-经济类.md
      - 账号类（A）: 处罚细目/05-账号类.md
      - 管理类（M）: 处罚细目/06-管理类.md
      - 群聊社区（Q）: 处罚细目/07-群聊社区.md

extra:
  generator: false
  social:
    - icon: fontawesome/solid/comment
      link: https://qm.qq.com/q/KvtrTgdMw8
      name: 官方 QQ 群
